<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyRun — Online Python Çalıştırıcı</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --panel2:#11151b; --border:#232a33;
    --text:#d7dee6; --muted:#7c8a99; --accent:#5fd0a0; --accent2:#e8b34c;
    --err:#e5686b; --mono: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef1f4; --border:#dbe1e7;
      --text:#1c232b; --muted:#5c6773; --accent:#1f9d6c; --accent2:#b97a12;
    }
  }
  :root[data-theme="dark"]{ --bg:#0e1116; --panel:#151a21; --panel2:#11151b; --border:#232a33; --text:#d7dee6; --muted:#7c8a99; --accent:#5fd0a0; --accent2:#e8b34c; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:12px;
    padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--border); background:var(--panel2); flex:0 0 auto;
  }
  .logo{ font-weight:700; font-size:15px; letter-spacing:.2px; color:var(--text); display:flex; align-items:center; gap:6px;}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  select{
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 10px; font-size:13px; font-family:var(--mono);
  }
  .spacer{flex:1;}
  button{
    font-family:inherit; font-size:13px; border-radius:6px; border:1px solid var(--border);
    padding:7px 14px; cursor:pointer; background:var(--panel); color:var(--text);
  }
  button:hover{border-color:var(--muted);}
  #run{
    background:var(--accent); color:#08130e; border:none; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  #run:disabled{opacity:.6; cursor:default;}
  #run svg{width:12px;height:12px;}
  main{flex:1; display:flex; min-height:0;}
  .pane{display:flex; flex-direction:column; min-width:0;}
  #editorPane{flex:1.3; border-right:1px solid var(--border);}
  #outPane{flex:1;}
  .paneHead{
    padding:7px 14px; font-size:11px; color:var(--muted); letter-spacing:.4px;
    border-bottom:1px solid var(--border); background:var(--panel2); flex:0 0 auto;
    display:flex; justify-content:space-between; align-items:center;
  }
  .paneHead button{padding:3px 9px; font-size:11px;}
  #editorWrap{flex:1; position:relative; min-height:0;}
  textarea#code{
    width:100%; height:100%; resize:none; border:none; outline:none;
    background:var(--bg); color:var(--text); font-family:var(--mono);
    font-size:14px; line-height:1.55; padding:14px 14px 14px 54px; tab-size:4;
  }
  #lines{
    position:absolute; left:0; top:0; bottom:0; width:44px;
    padding:14px 0; font-family:var(--mono); font-size:14px; line-height:1.55;
    color:var(--muted); text-align:right; user-select:none; pointer-events:none;
    background:var(--panel2); border-right:1px solid var(--border);
  }
  #lines div{padding-right:8px;}
  #output{
    flex:1; overflow:auto; padding:14px; font-family:var(--mono); font-size:13px;
    line-height:1.6; white-space:pre-wrap; word-break:break-word; background:var(--bg);
  }
  #output .err{color:var(--err);}
  #output .ok{color:var(--accent);}
  #output .hint{color:var(--muted);}
  #stdinRow{
    display:flex; gap:8px; padding:8px 14px; border-top:1px solid var(--border);
    background:var(--panel2); flex:0 0 auto;
  }
  #stdinRow input{
    flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:7px 10px; font-family:var(--mono); font-size:13px; outline:none;
  }
  #stdinRow input:focus{border-color:var(--accent);}
  #stdinRow button{white-space:nowrap;}
  footer{
    flex:0 0 auto; padding:6px 16px; padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
    font-size:11px; color:var(--muted); border-top:1px solid var(--border); background:var(--panel2);
    display:flex; justify-content:space-between;
  }
  @media (max-width: 720px){
    main{flex-direction:column;}
    #editorPane{border-right:none; border-bottom:1px solid var(--border); flex:1;}
    #outPane{flex:1;}
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span>PyRun</div>
  <select id="preset">
    <option value="hello">Merhaba Dünya</option>
    <option value="loop">Döngü örneği</option>
    <option value="input">Girdi (input) örneği</option>
    <option value="error">Hata örneği</option>
  </select>
  <div class="spacer"></div>
  <button id="clear">Temizle</button>
  <button id="run" disabled>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <span id="runLabel">Yükleniyor…</span>
  </button>
</header>

<main>
  <section class="pane" id="editorPane">
    <div class="paneHead"><span>main.py</span></div>
    <div id="editorWrap">
      <div id="lines"></div>
      <textarea id="code" spellcheck="false"></textarea>
    </div>
  </section>
  <section class="pane" id="outPane">
    <div class="paneHead">
      <span>Çıktı (Console)</span>
      <button id="clearOut">Temizle</button>
    </div>
    <div id="output"><span class="hint">Python ortamı yükleniyor, birkaç saniye sürebilir…</span></div>
    <div id="stdinRow">
      <input id="stdinInput" placeholder="input() bekliyorsa buraya yaz ve Enter'a bas" disabled>
      <button id="stdinSend" disabled>Gönder</button>
    </div>
  </section>
</main>

<footer>
  <span>Ctrl/Cmd + Enter ile çalıştır</span>
  <span id="status">hazırlanıyor…</span>
</footer>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
(function(){
  const codeEl = document.getElementById('code');
  const linesEl = document.getElementById('lines');
  const outEl = document.getElementById('output');
  const runBtn = document.getElementById('run');
  const runLabel = document.getElementById('runLabel');
  const statusEl = document.getElementById('status');
  const stdinInput = document.getElementById('stdinInput');
  const stdinSend = document.getElementById('stdinSend');
  const presetSel = document.getElementById('preset');

  const presets = {
    hello: `print("Merhaba dünya!")\nisim = "Cemal"\nprint(f"Selam {isim}, PyRun'a hoş geldin.")`,
    loop: `toplam = 0\nfor i in range(1, 11):\n    toplam += i\n    print(i, "-> toplam:", toplam)\nprint("Sonuç:", toplam)`,
    input: `isim = input("Adın ne? ")\nyas = input("Yaşın kaç? ")\nprint(f"Merhaba {isim}, {yas} yaşındasın demek.")`,
    error: `sayilar = [1, 2, 3]\nprint(sayilar[5])  # bilerek hata`,
  };
  presetSel.addEventListener('change', () => {
    codeEl.value = presets[presetSel.value] || '';
    updateLines();
  });
  codeEl.value = presets.hello;

  function updateLines(){
    const n = codeEl.value.split('\n').length;
    let html = '';
    for(let i=1;i<=n;i++) html += '<div>'+i+'</div>';
    linesEl.innerHTML = html;
    linesEl.scrollTop = codeEl.scrollTop;
  }
  codeEl.addEventListener('input', updateLines);
  codeEl.addEventListener('scroll', () => linesEl.scrollTop = codeEl.scrollTop);
  codeEl.addEventListener('keydown', (e) => {
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = codeEl.selectionStart, en = codeEl.selectionEnd;
      codeEl.value = codeEl.value.slice(0,s) + '    ' + codeEl.value.slice(en);
      codeEl.selectionStart = codeEl.selectionEnd = s+4;
      updateLines();
    }
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); runCode(); }
  });
  updateLines();

  document.getElementById('clear').addEventListener('click', ()=>{ codeEl.value=''; updateLines(); codeEl.focus(); });
  document.getElementById('clearOut').addEventListener('click', ()=>{ outEl.innerHTML=''; });

  function appendOut(text, cls){
    const span = document.createElement('span');
    if(cls) span.className = cls;
    span.textContent = text;
    outEl.appendChild(span);
    outEl.scrollTop = outEl.scrollHeight;
  }

  let pyodide = null;
  let stdinResolve = null;

  async function boot(){
    try{
      pyodide = await loadPyodide();
      outEl.innerHTML = '';
      appendOut('Python ortamı hazır. Kodunu yaz ve Çalıştır\'a bas.\n', 'ok');
      runBtn.disabled = false;
      runLabel.textContent = 'Çalıştır';
      statusEl.textContent = 'hazır';

      pyodide.setStdout({ batched: (s) => appendOut(s + (s.endsWith('\n') ? '' : '\n')) });
      pyodide.setStderr({ batched: (s) => appendOut(s + (s.endsWith('\n') ? '' : '\n'), 'err') });

      await pyodide.runPythonAsync(`
import builtins
from js import __py_input_bridge
def _js_input(prompt=""):
    val = __py_input_bridge(prompt)
    print(str(prompt) + str(val))
    return val
builtins.input = _js_input
`);
    }catch(err){
      appendOut('Python ortamı yüklenemedi: ' + err + '\n', 'err');
      statusEl.textContent = 'hata';
    }
  }

  // input() çağrıları tarayıcının senkron prompt() kutusunu kullanır
  window.__py_input_bridge = function(prompt){
    const val = window.prompt(prompt || '');
    return val === null ? '' : val;
  };
  stdinInput.placeholder = "input() burada değil, açılan pencerede sorulur";
  stdinInput.disabled = true; stdinSend.disabled = true;

  async function runCode(){
    if(!pyodide || runBtn.disabled) return;
    runBtn.disabled = true;
    runLabel.textContent = 'Çalışıyor…';
    statusEl.textContent = 'çalışıyor…';
    outEl.innerHTML = '';
    stdinInput.disabled = true; stdinSend.disabled = true;

    let src = codeEl.value;
    const wrapped = `
_user_src = ${JSON.stringify(src)}
_code = compile(_user_src, "<main.py>", "exec")
exec(_code, {"__name__": "__main__"})
`;
    try{
      await pyodide.runPythonAsync(wrapped);
      appendOut('\n[Program tamamlandı]\n', 'ok');
    }catch(err){
      appendOut(String(err), 'err');
    }finally{
      runBtn.disabled = false;
      runLabel.textContent = 'Çalıştır';
      statusEl.textContent = 'hazır';
      stdinInput.disabled = true; stdinSend.disabled = true;
    }
  }
  runBtn.addEventListener('click', runCode);

  boot();
})();
</script>
</body>
</html>
